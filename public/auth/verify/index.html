<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Sign In - Anypod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0d0f17;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #181c2b;
      border: 1px solid #2e354f;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .btn {
      width: 100%;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #6366f1;
      color: #fff;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔑</div>
    <h1>Confirm Sign In</h1>
    <p id="info-text">Click the button below to complete your authentication and open Anypod.</p>
    <button class="btn" id="btn-confirm">Confirm Sign In</button>
    <div class="error-msg" id="error-box"></div>
  </div>
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const btn = document.getElementById('btn-confirm');
      const errorBox = document.getElementById('error-box');
      const infoText = document.getElementById('info-text');

      if (!token) {
        btn.style.display = 'none';
        infoText.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = 'Invalid verification link. Token parameter is missing.';
        return;
      }

      async function doVerify() {
        btn.disabled = true;
        btn.textContent = 'Signing you in...';
        infoText.textContent = 'Verifying your login link and redirecting...';
        errorBox.style.display = 'none';

        try {
          const res = await fetch('/api/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Verification failed');
          }

          if (data.sessionToken) {
            localStorage.setItem('anypod_session_token', data.sessionToken);
            window.location.href = '/?session=' + encodeURIComponent(data.sessionToken);
          } else {
            window.location.href = '/';
          }
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Confirm Sign In';
          infoText.textContent = 'Click the button below to complete your authentication and open Anypod.';
          errorBox.style.display = 'block';
          errorBox.textContent = err.message;
        }
      }

      btn.addEventListener('click', doVerify);
      doVerify();
    })();
  </script>
</body>
</html>
