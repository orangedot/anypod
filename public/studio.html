<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="Anypod Studio: podcast hosting on Cloudflare R2 with zero egress fees, Podcasting 2.0 feeds and a free embeddable player.">
  <title>Anypod Studio · Podcast hosting with zero egress</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/studio-app/studio.css">
</head>
<body>
  <div class="st-app">
    <aside class="st-rail">
      <div class="st-brand">
        <span class="st-brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
        </span>
        <div>
          <div class="st-brand-name">anypod studio</div>
          <div class="st-brand-tag">podcast hosting</div>
        </div>
      </div>

      <div class="st-show-switch">
        <label for="st-show-select">Show</label>
        <select class="st-select" id="st-show-select"></select>
        <button type="button" class="st-btn st-btn-sm" data-open-show="1">New show</button>
      </div>

      <nav class="st-nav" id="st-nav" aria-label="Studio sections"></nav>

      <div class="st-rail-foot">
        <span class="st-card-sub" id="st-rail-user"></span>
        <button type="button" class="st-btn st-btn-sm" data-toggle-theme="1">Theme</button>
        <a class="st-btn st-btn-sm" href="/">Back to player</a>
      </div>
    </aside>

    <div class="st-main">
      <div class="st-demo-banner hidden" id="st-demo-banner">
        <span><strong>Demo studio.</strong> Explore freely, try the audio analyser, then sign in to host your own show on Cloudflare R2.</span>
        <button type="button" class="st-btn st-btn-sm st-btn-primary" data-open-claim="1">Sign in or create show</button>
      </div>
      <div id="st-view-root"></div>
    </div>
  </div>

  <nav class="st-mobile-nav" id="st-mobile-nav" aria-label="Studio sections"></nav>

  <dialog class="st-dialog" id="st-claim-dialog">
    <form class="st-dialog-body" id="st-claim-form">
      <h2 class="st-card-title">Sign in to publish</h2>
      <p class="st-card-sub">Enter your email and we send a magic link. No password. Your analysed audio stays in this tab.</p>
      <input class="st-input" id="st-claim-email" type="email" placeholder="you@email.com" required>
      <p class="st-card-sub" id="st-claim-msg"></p>
      <div class="st-actions">
        <button type="button" class="st-btn" data-close-dialog="1">Close</button>
        <button type="submit" class="st-btn st-btn-primary">Send magic link</button>
      </div>
    </form>
  </dialog>

  <dialog class="st-dialog" id="st-show-dialog">
    <form class="st-dialog-body" id="st-show-form">
      <h2 class="st-card-title">Create a show</h2>
      <input class="st-input" id="st-new-title" placeholder="Show title" required>
      <input class="st-input" id="st-new-slug" placeholder="show-slug" required>
      <input class="st-input" id="st-new-author" placeholder="Host name">
      <select class="st-select" id="st-new-category">
        <option>Technology</option>
        <option>Science</option>
        <option>Education</option>
        <option>Arts</option>
        <option>Business</option>
        <option>Music</option>
        <option>News</option>
      </select>
      <input class="st-input" id="st-new-cover" type="url" placeholder="Cover image URL (3000x3000 recommended)">
      <textarea class="st-textarea" id="st-new-desc" placeholder="What is your show about?"></textarea>
      <div class="st-actions">
        <button type="button" class="st-btn" data-close-dialog="1">Cancel</button>
        <button type="submit" class="st-btn st-btn-primary">Create show</button>
      </div>
    </form>
  </dialog>

  <div class="st-toast" id="st-toast" role="status"></div>

  <script src="/shared/studio-uploader.js"></script>
  <script src="/studio-app/studio-demo.js"></script>
  <script src="/studio-app/studio-directories.js"></script>
  <script src="/studio-app/studio.js"></script>
</body>
</html>
