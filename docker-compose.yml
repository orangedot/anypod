services:
  podany:
    build:
      context: .
      dockerfile: Dockerfile
    image: podany:latest
    container_name: podany
    restart: unless-stopped
    ports:
      - "${PORT:-8788}:8788"
    volumes:
      # Persistent local SQLite database, subscriptions, and optional config file
      - ./data:/data
      # Optional: Uncomment if you prefer a config file in the project root:
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      - PORT=${PORT:-8788}
      - APP_URL=${APP_URL:-http://localhost:8788}
      - FROM_EMAIL=${FROM_EMAIL:-Podany <login@podany.local>}
      # Optional: Resend API key for magic-link emails (https://resend.com)
      # If left empty, Podany runs in 100% offline mode (magic login link is printed to terminal & returned in UI!)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # Optional: Secret key to secure the /api/cron/cleanup endpoint
      - CRON_SECRET=${CRON_SECRET:-}
